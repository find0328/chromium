<!DOCTYPE html>
<script src="../resources/testharness.js"></script>
<script src="../resources/testharness-helpers.js"></script>
<script src="../resources/testharnessreport.js"></script>
<script src="resources/bluetooth-helpers.js"></script>
<script>
'use strict';

test(t => { assert_true(window.testRunner instanceof Object); t.done(); },
     'window.testRunner is required for the following tests.');

promise_test(() => {
  testRunner.setBluetoothMockDataSet('HeartRateAdapter');
  return assert_promise_rejects_with_message(
    requestDeviceWithKeyDown({filters: [{services: ['human_interface_device']}]}),
    new DOMException(
      'requestDevice() called with a filter containing a blacklisted UUID.',
      'SecurityError'),
    'Requesting blacklisted service rejects.');
}, 'Reject with SecurityError if requesting a blacklisted service.');

promise_test(() => {
  testRunner.setBluetoothMockDataSet('HeartRateAndHIDAdapter');
  return requestDeviceWithKeyDown({filters: [{services: ['heart_rate']}],
                                   optionalServices: ['human_interface_device']})
    .then(device => device.gatt.connect())
    .then(gattServer => {
      return assert_promise_rejects_with_message(
        gattServer.getPrimaryService('human_interface_device'), new DOMException(
          'Failed to execute \'getPrimaryService\' on ' +
          '\'BluetoothGATTRemoteServer\': Invalid Service name: ' +
          '\'wrong_name\'. ' +
          'It must be a valid UUID alias (e.g. 0x1234), ' +
          'UUID (lowercase hex characters e.g. ' +
          '\'00001234-0000-1000-8000-00805f9b34fb\'), ' +
          'or recognized standard name from ' +
          'https://developer.bluetooth.org/gatt/services/Pages/ServicesHome.aspx' +
          ' e.g. \'alert_notification\'.',
          'SyntaxError'),
        'Wrong Service name passed.');
    });
}, 'Blacklisted UUID in optionalServices is removed and access not granted.');


</script>
